services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cosmic_connect
      POSTGRES_USER: cosmic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cosmic_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmic -d cosmic_connect"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  cosmic_postgres:
